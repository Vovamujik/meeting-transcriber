name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Lint
        run: uvx ruff check src tests
      - name: Unit tests
        # Pure-logic tests only: no models, no torch. Avoids pulling ~4 GB of CUDA wheels on every run.
        run: uv run --isolated --no-project --python 3.12 --with rich --with certifi --with python-dotenv --with pytest pytest -q
        env:
          PYTHONPATH: src
      - name: Skill wrapper syntax
        run: bash -n skills/transcribe-meeting/scripts/run.sh
